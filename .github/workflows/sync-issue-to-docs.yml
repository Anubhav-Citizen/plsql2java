name: Sync GitHub Issue → Local Docs

on:
  issues:
    types: [opened, edited]

jobs:
  sync-to-docs:
    # Only process issues that look like user stories (title starts with "Story")
    if: startsWith(github.event.issue.title, 'Story')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate aidlc-docs story document
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          PROJECT_NUMBER: "1"
          PROJECT_OWNER: "Anubhav-Citizen"
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          python3 - <<'PYEOF'
          import sys, os, re
          sys.path.insert(0, ".github/scripts")
          import story_sync as s

          issue = {
              "title":   os.environ["ISSUE_TITLE"],
              "body":    os.environ["ISSUE_BODY"],
              "number":  int(os.environ["ISSUE_NUMBER"]),
              "node_id": os.environ["ISSUE_NODE_ID"],
          }

          story = s.issue_to_story(issue)
          doc   = s.story_to_doc(story)
          path  = s.doc_path_for_story(story)

          # Write the document
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w") as f:
              f.write(doc)
          print(f"Written: {path}")

          # Also append to stories.md if this is a brand-new story not already there
          stories_file = "aidlc-docs/inception/user-stories/stories.md"
          with open(stories_file) as f:
              existing_content = f.read()

          if story["title"] not in existing_content:
              epic_header = f"## {story['epic']}"
              new_section = (
                  f"\n\n### {story['title']}\n\n"
                  f"{story['body']}\n"
              )
              if epic_header in existing_content:
                  # Insert after the epic header
                  insert_at = existing_content.index(epic_header) + len(epic_header)
                  updated = existing_content[:insert_at] + new_section + existing_content[insert_at:]
              else:
                  # Append new epic + story at end
                  updated = (existing_content.rstrip() +
                             f"\n\n{epic_header}\n\n*Auto-added from GitHub Issue #{issue['number']}*\n"
                             + new_section)
              with open(stories_file, "w") as f:
                  f.write(updated)
              print(f"Appended story to {stories_file}")

          # Add issue to project board
          project_id = s.get_project_id()
          s.add_issue_to_project(project_id, issue["node_id"])
          print(f"Added issue #{issue['number']} to project")

          # Comment on the issue to confirm
          import requests
          comment = (
              f"✅ **Story synced to local docs**\n\n"
              f"- Document created: `{path}`\n"
              f"- Added to project board\n"
              f"- `stories.md` updated\n\n"
              f"A commit with these changes will be pushed to the repository."
          )
          requests.post(
              f"{s.API}/repos/{s.REPO}/issues/{issue['number']}/comments",
              headers=s.REST_HEADERS,
              json={"body": comment},
          )
          PYEOF

      - name: Commit and push generated docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aidlc-docs/inception/user-stories/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: sync story from GitHub Issue #${{ github.event.issue.number }}

          Story: ${{ github.event.issue.title }}
          Auto-generated by sync-issue-to-docs workflow."
          git pull --rebase origin main
          git push
