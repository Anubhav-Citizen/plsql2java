name: Sync GitHub Discussion → Local Docs

on:
  discussion:
    types: [created, edited]

jobs:
  sync-to-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate structured doc from Discussion
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          DISCUSSION_CATEGORY: ${{ github.event.discussion.category.name }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
        run: |
          python3 - <<'PYEOF'
          import sys, os
          sys.path.insert(0, ".github/scripts")
          import doc_sync as d

          discussion = {
              "title":   os.environ["DISCUSSION_TITLE"],
              "body":    os.environ["DISCUSSION_BODY"],
              "number":  int(os.environ["DISCUSSION_NUMBER"]),
              "node_id": os.environ["DISCUSSION_NODE_ID"],
          }
          cat_name = os.environ["DISCUSSION_CATEGORY"]

          # Skip auto-synced discussions (they came from local, not from a human)
          if "Auto-synced from local aidlc-docs" in discussion["body"]:
              print("Skipping auto-synced discussion — originated from local push.")
              exit(0)

          # Resolve category
          cat = d.CATEGORY_BY_NAME.get(cat_name)
          if cat is None:
              print(f"Unknown category '{cat_name}' — skipping.")
              exit(0)

          # Generate structured document
          doc_content = d.discussion_to_doc(discussion, cat)
          doc_path    = d.doc_path_for_discussion(discussion, cat)

          # Write file
          os.makedirs(os.path.dirname(doc_path), exist_ok=True)
          with open(doc_path, "w") as f:
              f.write(doc_content)
          print(f"Written: {doc_path}")

          # Write path to env file for next step
          with open(os.environ["GITHUB_ENV"], "a") as ef:
              ef.write(f"DOC_PATH={doc_path}\n")
              ef.write(f"SKIP_COMMIT=false\n")
          PYEOF

      - name: Commit and push generated doc
        if: env.SKIP_COMMIT != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aidlc-docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: generate doc from Discussion #${{ github.event.discussion.number }}

          Title: ${{ github.event.discussion.title }}
          Category: ${{ github.event.discussion.category.name }}
          File: ${{ env.DOC_PATH }}
          Auto-generated by sync-discussion-to-docs workflow."
          git pull --rebase origin main
          git push

      - name: Comment on Discussion
        if: env.SKIP_COMMIT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
        run: |
          python3 - <<'PYEOF'
          import sys, os
          sys.path.insert(0, ".github/scripts")
          import doc_sync as d, requests

          doc_path = os.environ.get("DOC_PATH", "")
          disc_id  = os.environ["DISCUSSION_NODE_ID"]

          comment = (
              f"✅ **Document synced to local docs**\n\n"
              f"- Generated: `{doc_path}`\n"
              f"- Committed to repository automatically\n\n"
              f"The structured document has been created in `aidlc-docs/` "
              f"following the project documentation standards."
          )

          d.gql("""
          mutation($discussionId: ID!, $body: String!) {
            addDiscussionComment(input: {discussionId: $discussionId, body: $body}) {
              comment { id }
            }
          }""", {"discussionId": disc_id, "body": comment})
          print("Comment posted.")
          PYEOF
